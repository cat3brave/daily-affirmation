name: AI usage limit DB

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/review/ai-usage-limit/**'
      - 'docs/ai-usage-limit-design.md'
      - '.github/workflows/ai-usage-limit-db.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/review/ai-usage-limit/**'
      - 'docs/ai-usage-limit-design.md'
      - '.github/workflows/ai-usage-limit-db.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    name: PostgreSQL ${{ matrix.postgres }} isolated DB
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '17']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Manual PGDG setup from https://www.postgresql.org/download/linux/ubuntu/.
      # Apt verifies signed repository metadata and package hashes; no remote script.
      - name: Install signed PostgreSQL packages
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /tmp/ai-usage-pgdg.asc
          fingerprint="$(gpg --show-keys --with-colons /tmp/ai-usage-pgdg.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 0644 /tmp/ai-usage-pgdg.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          rm /tmp/ai-usage-pgdg.asc
          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/ai-usage-pgdg.sources >/dev/null
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          # Suppress package-created clusters. Existing host services are never used.
          sudo install -d /etc/postgresql-common
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "postgresql-${PG_MAJOR}" "postgresql-client-${PG_MAJOR}"
          dpkg-query -W "postgresql-${PG_MAJOR}" "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Run isolated SQL, concurrency, boundaries and rollback tests
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          timeout --signal=TERM --kill-after=30s 300s python3 supabase/review/ai-usage-limit/04-test-local.py
